<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CicloZen 🌸</title>
    <style>
        :root {
            --bg: #fff0f3;
            --card: #ffffff;
            --text: #590d22;
            --accent: #ff4d6d;
            --secondary: #ffccd5;
            --tpm: #c9184a;
            --fertile: #80b918;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(255, 77, 109, 0.15);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h1 { margin-top: 0; color: var(--accent); }
        label { display: block; margin: 15px 0 5px; font-weight: bold; text-align: left; }
        
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--secondary);
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            color: var(--text);
        }
        input:focus { border-color: var(--accent); }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 25px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        button:hover { background-color: #d63353; transform: translateY(-2px); }

        /* RESULTADOS */
        .cards-grid {
            display: grid;
            gap: 15px;
            margin-top: 30px;
            display: none; /* Escondido até calcular */
        }

        .info-card {
            background: #fff;
            padding: 15px;
            border-radius: 15px;
            border-left: 5px solid var(--accent);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: left;
        }
        
        .card-title { font-size: 12px; text-transform: uppercase; color: #888; font-weight: bold; }
        .card-date { font-size: 18px; font-weight: bold; margin-top: 5px; display: block; }
        .card-desc { font-size: 13px; margin-top: 5px; color: #666; }

        .tpm-card { border-color: var(--tpm); background-color: #fff5f7; }
        .fertile-card { border-color: var(--fertile); background-color: #f7fff0; }

        .footer-note { font-size: 12px; margin-top: 20px; color: #999; }
    </style>
</head>
<body>

<div class="container">
    <h1>🌸 CicloZen</h1>
    <p>Acompanhamento simples e privado.</p>

    <div id="setup-form">
        <label>Data da Última Menstruação (Início)</label>
        <input type="date" id="lastPeriod">

        <label>Duração Média do Ciclo (Dias)</label>
        <input type="number" id="cycleDays" value="28" placeholder="Ex: 28">

        <button onclick="calcularCiclo()">Ver Previsão ✨</button>
    </div>

    <div id="results" class="cards-grid">
        <div class="info-card">
            <span class="card-title" style="color:var(--accent)">🩸 Próximo Ciclo</span>
            <span class="card-date" id="next-period-date">--/--</span>
            <span class="card-desc">Prepare-se com antecedência.</span>
        </div>

        <div class="info-card tpm-card">
            <span class="card-title" style="color:var(--tpm)">😡 Alerta de TPM (Estimado)</span>
            <span class="card-date" id="tpm-date">--/--</span>
            <span class="card-desc">Fase lútea: humor pode oscilar.</span>
        </div>

        <div class="info-card fertile-card">
            <span class="card-title" style="color:var(--fertile)">🌿 Janela Fértil</span>
            <span class="card-date" id="fertile-date">--/--</span>
            <span class="card-desc">Maior probabilidade de gravidez.</span>
        </div>

        <button onclick="limpar()" style="background:#eee; color:#666; margin-top:10px">Refazer Cálculo ↺</button>
    </div>
    
    <div class="footer-note">*Este app é uma estimativa matemática e não substitui aconselhamento médico.</div>
</div>

<script>
    // Recupera dados salvos se existirem
    window.onload = () => {
        if(localStorage.getItem('lastPeriod')) {
            document.getElementById('lastPeriod').value = localStorage.getItem('lastPeriod');
            document.getElementById('cycleDays').value = localStorage.getItem('cycleDays');
            calcularCiclo(); // Já mostra direto se tiver salvo
        }
    }

    function calcularCiclo() {
        const lastDate = document.getElementById('lastPeriod').value;
        const cycleLength = parseInt(document.getElementById('cycleDays').value);

        if(!lastDate || !cycleLength) {
            alert("Por favor, preencha a data e a duração do ciclo!");
            return;
        }

        // Salva para a próxima vez (Persistência de Dados)
        localStorage.setItem('lastPeriod', lastDate);
        localStorage.setItem('cycleDays', cycleLength);

        // Cálculos Matemáticos de Data (Javascript Date Object)
        // O JS trabalha com milissegundos, então somamos dias * 24h * 60m * 60s * 1000ms
        const dataInicio = new Date(lastDate + 'T00:00:00'); // T00... força fuso local para não bugar dia
        
        // 1. Próxima Menstruação = Data + Duração do Ciclo
        const nextPeriod = new Date(dataInicio);
        nextPeriod.setDate(dataInicio.getDate() + cycleLength);

        // 2. Ovulação (Geralmente 14 dias ANTES do próximo ciclo)
        const ovulation = new Date(nextPeriod);
        ovulation.setDate(nextPeriod.getDate() - 14);

        // Janela Fértil (3 dias antes e 1 depois da ovulação)
        const fertileStart = new Date(ovulation);
        fertileStart.setDate(ovulation.getDate() - 3);
        const fertileEnd = new Date(ovulation);
        fertileEnd.setDate(ovulation.getDate() + 1);

        // 3. TPM (Geralmente começa 1 semana antes da menstruação)
        const tpmStart = new Date(nextPeriod);
        tpmStart.setDate(nextPeriod.getDate() - 7);


        // Renderizar na Tela (Formatando DD/MM)
        const opcoesData = { day: '2-digit', month: '2-digit' };
        
        document.getElementById('next-period-date').innerText = nextPeriod.toLocaleDateString('pt-BR');
        document.getElementById('tpm-date').innerText = `A partir de ${tpmStart.toLocaleDateString('pt-BR')}`;
        document.getElementById('fertile-date').innerText = `${fertileStart.toLocaleDateString('pt-BR')} a ${fertileEnd.toLocaleDateString('pt-BR')}`;

        // UI Transition
        document.getElementById('setup-form').style.display = 'none';
        document.getElementById('results').style.display = 'grid';
    }

    function limpar() {
        localStorage.clear();
        location.reload();
    }
</script>

</body>
</html>
